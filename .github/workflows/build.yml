name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: devkitpro/devkitarm
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev libelf-dev

      - name: Install Dependencies
        run: ./init_deps.sh

      - name: Check Species Change Report
        run: make check-species-report

      - name: Build Debug
        env:
          COMPARE: 0
          RELEASE: 0
        run: make -j4 -O all

      - name: Build Release
        env:
          COMPARE: 0
          RELEASE: 1
        run: make -j4 -O all

      - name: Update Memory Stats
        uses: actions/upload-artifact@v4
        with:
          name: Memory Stats
          path: pokeemerald_memorystats.csv

      - name: Test
        env:
          BUILD_JOBS: 4
        run: ./scripts/launch_build_test.sh --check-all-suites

  macos:
    name: macOS build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and host dependencies
        run: |
          brew install libpng pkgconf
          brew install --cask gcc-arm-embedded
          test -f "$(arm-none-eabi-gcc -print-file-name=libc.a)"
          test -f "$(arm-none-eabi-gcc -print-file-name=libnosys.a)"

      - name: Install project dependencies
        run: ./init_deps.sh

      - name: Check Species Change Report
        run: make check-species-report

      - name: Build Debug
        env:
          RELEASE: 0
        run: make -j4 -O all

      - name: Build Release
        env:
          RELEASE: 1
        run: make -j4 -O all
