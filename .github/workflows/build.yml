name: CI

on:
  push:
    branches:
      - main
      - vanilla
      - vanilla-dev
      - expansion
      - expansion-dev
  pull_request:
    branches:
      - main
      - vanilla
      - vanilla-dev
      - expansion
      - expansion-dev

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev libelf-dev
        # build-essential, git, and libpng-dev are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install Dependencies
        run: |
          ./init_deps.sh

      - name: Check Species Change Report
        run: make check-species-report

      - name: Build Debug
        env:
          COMPARE: 0
          RELEASE: 0
        run: make -j${nproc} -O all

      - name: Build Release
        env:
          COMPARE: 0
          RELEASE: 1
        run: make -j${nproc} -O all

      - name: Update Memory Stats
        uses: actions/upload-artifact@v4
        with:
          name: Memory Stats
          path: pokeemerald_memorystats.csv

      - name: Test
        run: ./scripts/launch_build_test.sh --check-all-suites
